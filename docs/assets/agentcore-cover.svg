 <text x="51" y="204" fill="#f8fafc" font-size="49" font-weight="700" letter-spacing="-1.8">Intelligence, connected.</text>
 <text x="54" y="248" fill="#b2a2ff" font-size="25" letter-spacing="-.3">Orchestrate the work. Understand every step.</text>
 <text x="55" y="288" fill="#94a3b8" font-size="16">Visual workflows · Specialized agents · Human approval</text>
